<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Simulados SAEB</title>
  
  <!-- Estilos CSS da aplicação -->
  <link rel="stylesheet" href="style.css">
  
  <!-- MathJax para renderização de fórmulas matemáticas e suporte a TeX -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>

  <!-- CONTAINER PRINCIPAL DO APP -->
  <div class="app-container" id="appContainer">
    
    <!-- ========================================== -->
    <!-- PAINEL LATERAL ESQUERDO (CONFIGURAÇÕES)     -->
    <!-- ========================================== -->
    <aside class="sidebar-painel" id="sidebarPainel">
      <h2>1. Configurações da Prova</h2>

      <!-- Upload da Logomarca -->
      <div class="grupo-campo">
        <label>Logo da Escola (Imagem):</label>
        <input type="file" id="inputLogo" accept="image/*" onchange="carregarLogo(event)">
      </div>

      <!-- Dados do Cabeçalho -->
      <div class="grupo-campo">
        <label>Nome da Escola:</label>
        <input type="text" id="inputNomeEscola" value="ESCOLA MUNICIPAL DE EDUCAÇÃO BÁSICA NOSSA SENHORA DO PILAR" oninput="atualizarCabecalho()">
      </div>

      <div class="linha-dupla">
        <div class="grupo-campo">
          <label>Série:</label>
          <input type="text" id="inputSerie" value="8º ANO" oninput="atualizarCabecalho()">
        </div>
        <div class="grupo-campo">
          <label>Turma:</label>
          <input type="text" id="inputTurma" value="A" oninput="atualizarCabecalho()">
        </div>
      </div>

      <div class="linha-dupla">
        <div class="grupo-campo">
          <label>Professor:</label>
          <input type="text" id="inputNomeProfessor" value="Aparecido Sousa" oninput="atualizarCabecalho()">
        </div>
        <div class="grupo-campo">
          <label>Disciplina:</label>
          <input type="text" id="inputDisciplina" value="PROVA DE MATEMÁTICA" oninput="atualizarCabecalho()">
        </div>
      </div>

      <div class="grupo-campo">
        <label>Bimestre:</label>
        <input type="text" id="inputBimestre" value="2º BIMESTRE" oninput="atualizarCabecalho()">
      </div>

      <!-- Botões Globais (Reiniciar, Desfazer, Refazer) -->
      <div class="acoes-principais">
        <button type="button" class="btn-perigo" onclick="reiniciarTudo()">🔄 Reiniciar Prova</button>
        <button type="button" class="btn-secundario" onclick="desfazerAcao()">↩️ Desfazer</button>
        <button type="button" class="btn-secundario" onclick="refazerAcao()">↪️ Refazer</button>
      </div>

      <!-- Botão para Inserir Quebra de Página Manual -->
      <button type="button" class="btn-sucesso" style="width: 100%; margin-top: 5px;" onclick="inserirQuebraPagina()">
        ✂️ Inserir Quebra de Página Manual
      </button>

      <hr class="divisor-secao">

      <!-- ========================================== -->
      <!-- BANCO DE QUESTÕES INTEGRADO                -->
      <!-- ========================================== -->
      <h3>2. Banco de Questões</h3>
      <div class="grupo-campo">
        <label for="filtroDescritor">Filtrar por Descritor:</label>
        <select id="filtroDescritor" onchange="filtrarBanco()">
          <option value="todos">Todos os Descritores</option>
        </select>
      </div>

      <!-- Lista Rolável de Questões do Banco -->
      <div class="banco-container" id="bancoQuestoesContainer">
        <!-- Itens inseridos dinamicamente pelo script.js -->
      </div>

      <hr class="divisor-secao">

      <!-- ========================================== -->
      <!-- CRIAR NOVA QUESTÃO / PERSONALIZADA         -->
      <!-- ========================================== -->
      <h3>3. Criar Nova Questão (Suporte a TeX)</h3>
      <div class="grupo-campo">
        <label>Tipo de Questão:</label>
        <select id="novoTipoQuestao" onchange="alternarCamposOpcoes()">
          <option value="objetiva">Múltipla Escolha (Objetiva)</option>
          <option value="subjetiva">Discursiva (Subjetiva)</option>
        </select>
      </div>

      <div class="grupo-campo">
        <label>Descritor (ex: D36):</label>
        <input type="text" id="novoDescritor" placeholder="Ex: D36, D1...">
      </div>

      <div class="grupo-campo">
        <label>Enunciado (Use fórmulas):</label>
        <textarea id="novoEnunciado" rows="3" placeholder="Digite o enunciado da questão..."></textarea>
      </div>

      <!-- Campos das Opções (A, B, C, D) -->
      <div id="containerOpcoesCriacao">
        <div class="grupo-campo">
          <label>Opção A:</label>
          <input type="text" id="novaOpcaoA">
        </div>
        <div class="grupo-campo">
          <label>Opção B:</label>
          <input type="text" id="novaOpcaoB">
        </div>
        <div class="grupo-campo">
          <label>Opção C:</label>
          <input type="text" id="novaOpcaoC">
        </div>
        <div class="grupo-campo">
          <label>Opção D:</label>
          <input type="text" id="novaOpcaoD">
        </div>
      </div>

      <div class="linha-dupla" style="margin-top: 10px;">
        <button type="button" class="btn-secundario" onclick="abrirPreviaNovaQuestao()">👁️ Prévia</button>
        <button type="button" class="btn-primario" onclick="salvarNovaQuestao()">➕ Salvar Questão</button>
      </div>
    </aside>

    <!-- BARRA CENTRAL REDIMENSIONÁVEL (RESIZER) -->
    <div class="resizer" id="resizer"></div>

    <!-- ========================================== -->
    <!-- ÁREA DE PRÉ-VISUALIZAÇÃO / FOLHAS A4       -->
    <!-- ========================================== -->
    <main class="area-impressao">
      <!-- Barra Superior de Ferramentas -->
      <div class="barra-ferramentas-topo">
        <span id="infoPaginas">Total de Páginas: 1</span>
        <button type="button" class="btn-sucesso" onclick="imprimirProva()">🖨️ Baixar PDF / Imprimir</button>
      </div>

      <!-- Banner de Alerta (Aparece se uma questão individual exceder a página) -->
      <div id="containerAlertaExt" style="width: 210mm;"></div>

      <!-- Container Dinâmico onde as Páginas A4 serão renderizadas -->
      <div id="conteudoProvasContainer">
        <!-- As folhas .folha-a4 são inseridas aqui pelo JS -->
      </div>
    </main>

  </div>

  <!-- MODAL DE PRÉ-VISUALIZAÇÃO DE QUESTÕES -->
  <div id="modalPreview" class="modal-overlay oculto">
    <div class="modal-conteudo">
      <h3>Prévia da Questão</h3>
      <div id="conteudoModalPreview" style="margin: 15px 0;"></div>
      <button type="button" class="btn-secundario" style="width: 100%;" onclick="fecharModalPreview()">Fechar</button>
    </div>
  </div>

  <!-- Script Lógico -->
  <script src="script.js"></script>
</body>
</html>
