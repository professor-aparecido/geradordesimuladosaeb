<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Simulados SAEB</title>
  <link rel="stylesheet" href="style.css">
  <!-- MathJax para suporte a fórmulas matemáticas -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
</head>
<body>

  <div class="app-container">
    <!-- PAINEL LATERAL DE CONFIGURAÇÕES -->
    <aside class="sidebar-painel" id="sidebar">
      <h2>1. Configurações da Prova</h2>
      
      <div class="grupo-campo">
        <label for="inputLogo">Logo da Escola (Imagem):</label>
        <input type="file" id="inputLogo" accept="image/*" onchange="carregarLogo(event)">
      </div>

      <div class="grupo-campo">
        <label for="inputEscola">Nome da Escola:</label>
        <input type="text" id="inputEscola" value="ESCOLA MUNICIPAL DE EDUCAÇÃO BÁSICA NOSSA SENHORA DO PILAR" oninput="atualizarCabecalho()">
      </div>

      <div class="linha-dupla">
        <div class="grupo-campo">
          <label for="inputSerie">Série:</label>
          <input type="text" id="inputSerie" value="8º ANO" oninput="atualizarCabecalho()">
        </div>
        <div class="grupo-campo">
          <label for="inputTurma">Turma:</label>
          <input type="text" id="inputTurma" value="A" oninput="atualizarCabecalho()">
        </div>
      </div>

      <div class="linha-dupla">
        <div class="grupo-campo">
          <label for="inputProfessor">Professor:</label>
          <input type="text" id="inputProfessor" value="Aparecido Sousa" oninput="atualizarCabecalho()">
        </div>
        <div class="grupo-campo">
          <label for="inputDisciplina">Disciplina:</label>
          <input type="text" id="inputDisciplina" value="PROVA DE MATEMÁTICA" oninput="atualizarCabecalho()">
        </div>
      </div>

      <div class="linha-dupla">
        <div class="grupo-campo">
          <label for="inputBimestre">Bimestre:</label>
          <input type="text" id="inputBimestre" value="2º BIMESTRE" oninput="atualizarCabecalho()">
        </div>
        <!-- NOVO SELETOR DE COLUNAS -->
        <div class="grupo-campo">
          <label for="selectColunas">Colunas por Página:</label>
          <select id="selectColunas" onchange="atualizarCabecalho()">
            <option value="2" selected>2 Colunas (Padrão)</option>
            <option value="1">1 Coluna (Página Inteira)</option>
          </select>
        </div>
      </div>

      <div class="botoes-acoes-top">
        <button type="button" class="btn-danger" onclick="reiniciarProva()">🔄 Reiniciar Prova</button>
        <button type="button" class="btn-secondary" onclick="desfazer()">↩️ Desfazer</button>
        <button type="button" class="btn-secondary" onclick="refazer()">↪️ Refazer</button>
      </div>

      <button type="button" class="btn-quebra" onclick="inserirQuebraPaginaManual()">✂️ Inserir Quebra de Página Manual</button>

      <hr>

      <h2>2. Banco de Questões</h2>
      <div class="grupo-campo">
        <label for="filtroDescritor">Filtrar por Descritor:</label>
        <select id="filtroDescritor" onchange="filtrarBancoQuestoes()">
          <option value="todos">Todos os Descritores</option>
        </select>
      </div>
      <div id="listaBancoQuestoes" class="lista-banco"></div>

      <hr>

      <h2>3. Criar Nova Questão (Suporte a TeX)</h2>
      <div class="grupo-campo">
        <label for="novoTipo">Tipo de Questão:</label>
        <select id="novoTipo" onchange="alternarCamposOpcoes()">
          <option value="objetiva">Objetiva (Múltipla Escolha)</option>
          <option value="subjetiva">Subjetiva (Discursiva)</option>
        </select>
      </div>

      <div class="grupo-campo">
        <label for="novoDescritor">Descritor / Habilidade:</label>
        <input type="text" id="novoDescritor" placeholder="Ex: D36">
      </div>

      <div class="grupo-campo">
        <label for="novoEnunciado">Enunciado (Use \( ... \) para matemática):</label>
        <textarea id="novoEnunciado" rows="3" placeholder="Digite o texto da questão..."></textarea>
      </div>

      <div id="containerOpcoes">
        <label>Alternativas:</label>
        <input type="text" class="input-opcao" placeholder="Alternativa A">
        <input type="text" class="input-opcao" placeholder="Alternativa B">
        <input type="text" class="input-opcao" placeholder="Alternativa C">
        <input type="text" class="input-opcao" placeholder="Alternativa D">
      </div>

      <button type="button" class="btn-primary" onclick="adicionarQuestaoPersonalizada()">➕ Adicionar Questão Personalizada</button>
    </aside>

    <!-- RESIZER PARA REDIMENSIONAR A SIDEBAR -->
    <div class="resizer" id="resizer"></div>

    <!-- ÁREA CENTRAL DE VISUALIZAÇÃO/IMPRESSÃO -->
    <main class="area-impressao">
      <div class="barra-ferramentas-topo">
        <span id="infoPaginas">Total de Páginas: 1</span>
        <button type="button" class="btn-print" onclick="window.print()">🖨️ Baixar PDF / Imprimir</button>
      </div>

      <div id="containerAlertaExt"></div>

      <div id="conteudoProvasContainer">
        <!-- As folhas A4 serão geradas dinamicamente aqui pelo JavaScript -->
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
