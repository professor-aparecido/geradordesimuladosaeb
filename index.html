<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de prova/simulado Saeb</title>

    <!-- BIBLIOTECA KATEX PARA SUPORTE A LATEX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA SUPERIOR (HEADER) -->
    <header class="app-header">
        <div class="header-title">
            <h1>Gerador de prova/simulado Saeb</h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-toggle-gabarito" id="btnToggleGabarito">👁️ Mostrar Gabarito (Professor)</button>
            <button class="btn btn-danger" id="btnRefazer">🔄 Refazer Prova</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir Prova</button>
        </div>
    </header>

    <!-- CORPO PRINCIPAL DO SISTEMA -->
    <main class="app-container">
        
        <!-- COLUNA ESQUERDA (MENU LATERAL) -->
        <aside class="sidebar-panel" id="sidebar">
            <div class="sidebar-header">
                <h2>Painel de Controle</h2>
                <button class="btn-toggle-sidebar" id="btnToggleSidebar" title="Recolher Menu">◀</button>
            </div>
            
            <div class="sidebar-content">
                
                <!-- SEÇÃO 1: CONFIGURAÇÃO DE CABEÇALHO -->
                <div class="accordion-item" id="accCabecalho">
                    <div class="accordion-header" id="btnToggleCabecalho" title="Clique para expandir/recolher">
                        <div class="acc-title-group">
                            <span class="acc-icon">⚙️</span>
                            <span class="acc-title">Configuração de Cabeçalho</span>
                        </div>
                        <button class="btn-acc-toggle" id="btnAccIcon">▼</button>
                    </div>

                    <div class="accordion-body collapsed" id="bodyCabecalho">
                        <div class="form-group">
                            <label for="inputNomeEscola">Nome da Escola:</label>
                            <input type="text" id="inputNomeEscola" class="form-input" value="ESCOLA MUNICIPAL DE EDUCAÇÃO BÁSICA NOSSA SENHORA DO PILAR">
                        </div>

                        <div class="form-group">
                            <label for="inputLogoEscola">Upload da Logo da Escola:</label>
                            <input type="file" id="inputLogoEscola" accept="image/*" class="form-input-file">
                        </div>

                        <div class="form-group">
                            <label for="inputTituloProva">Título da Prova / Simulado:</label>
                            <input type="text" id="inputTituloProva" class="form-input" value="SIMULADO DE MATEMÁTICA - SAEB 2026">
                        </div>

                        <div class="form-row">
                            <div class="form-group col-6">
                                <label for="inputSerie">Série / Etapa:</label>
                                <input type="text" id="inputSerie" class="form-input" value="8º ANO">
                            </div>
                            <div class="form-group col-6">
                                <label for="inputTurma">Turma:</label>
                                <input type="text" id="inputTurma" class="form-input" value="A">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="inputProfessor">Professor(a):</label>
                            <input type="text" id="inputProfessor" class="form-input" value="Aparecido Sousa">
                        </div>
                    </div>
                </div>

                <!-- SEÇÃO 2: CRIAR QUESTÕES -->
                <div class="accordion-item" id="accCriarQuestao">
                    <div class="accordion-header" id="btnToggleCriarQuestao" title="Clique para expandir/recolher">
                        <div class="acc-title-group">
                            <span class="acc-icon">📝</span>
                            <span class="acc-title">Criar Questões</span>
                        </div>
                        <button class="btn-acc-toggle" id="btnAccIconQuestao">▼</button>
                    </div>

                    <div class="accordion-body collapsed" id="bodyCriarQuestao">
                        <div class="form-group">
                            <label for="inputCodigoDescritor">Código do Descritor (Ex: D1, D13, D20):</label>
                            <input type="text" id="inputCodigoDescritor" class="form-input" placeholder="Ex.: D13">
                        </div>

                        <div class="form-group">
                            <label for="inputEnunciado">Enunciado da Questão: (ACEITA LATEX)</label>
                            <textarea id="inputEnunciado" class="form-textarea" rows="4" placeholder="Ex.: Resolva a equação $x^2=16$..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="inputImagemQuestao">Imagem da Questão (Opcional):</label>
                            <input type="file" id="inputImagemQuestao" accept="image/*" class="form-input-file">
                        </div>

                        <div class="form-group">
                            <label for="inputEscalaImagem">Escala da Imagem (%):</label>
                            <input type="number" id="inputEscalaImagem" class="form-input" value="100" min="10" max="300" step="5">
                        </div>

                        <div class="form-group">
                            <label>Tipo de Questão:</label>
                            <div class="radio-group">
                                <label><input type="radio" name="tipoQuestao" value="alternativas" checked> Com Alternativas</label>
                                <label><input type="radio" name="tipoQuestao" value="subjetiva"> Subjetiva</label>
                            </div>
                        </div>

                        <!-- CAMPOS PARA QUESTÃO COM ALTERNATIVAS -->
                        <div id="painelAlternativas" class="painel-tipo">
                            <div class="form-group">
                                <label>Layout das Alternativas:</label>
                                <div class="radio-group">
                                    <label><input type="radio" name="disposicaoAlt" value="vertical" checked> Vertical</label>
                                    <label><input type="radio" name="disposicaoAlt" value="horizontal"> Horizontal</label>
                                    <label><input type="radio" name="disposicaoAlt" value="grade2x2"> Grade 2x2 (A,B / C,D)</label>
                                </div>
                            </div>

                            <label class="section-label">Alternativas e Gabarito:</label>
                            <div class="alternativa-row">
                                <input type="radio" name="gabarito" value="A" checked title="Marcar como correta">
                                <span>A)</span>
                                <input type="text" class="form-input input-alt" id="altA" placeholder="Alternativa A">
                            </div>
                            <div class="alternativa-row">
                                <input type="radio" name="gabarito" value="B" title="Marcar como correta">
                                <span>B)</span>
                                <input type="text" class="form-input input-alt" id="altB" placeholder="Alternativa B">
                            </div>
                            <div class="alternativa-row">
                                <input type="radio" name="gabarito" value="C" title="Marcar como correta">
                                <span>C)</span>
                                <input type="text" class="form-input input-alt" id="altC" placeholder="Alternativa C">
                            </div>
                            <div class="alternativa-row">
                                <input type="radio" name="gabarito" value="D" title="Marcar como correta">
                                <span>D)</span>
                                <input type="text" class="form-input input-alt" id="altD" placeholder="Alternativa D">
                            </div>
                        </div>

                        <!-- CAMPOS PARA QUESTÃO SUBJETIVA -->
                        <div id="painelSubjetiva" class="painel-tipo hidden">
                            <div class="form-group">
                                <label for="inputRespostaGabarito">Gabarito / Resposta Esperada:</label>
                                <textarea id="inputRespostaGabarito" class="form-textarea" rows="2" placeholder="Digite a resposta oficial..."></textarea>
                            </div>
                        </div>

                        <!-- CONFIGURAÇÃO DE ESPAÇO INICIAL -->
                        <div class="form-group" style="margin-top: 8px;">
                            <label for="inputAlturaCalculo">Espaço para Cálculo / Rascunho (px):</label>
                            <input type="number" id="inputAlturaCalculo" class="form-input" value="0" min="0" step="10">
                        </div>

                        <!-- BOTÕES DE AÇÃO -->
                        <div class="form-actions">
                            <button class="btn btn-secondary" id="btnPreVisualizar">👁️ Pré-visualizar</button>
                            <button class="btn btn-primary" id="btnAdicionarQuestao">➕ Adicionar</button>
                        </div>
                    </div>
                </div>

                <!-- SEÇÃO 3: BANCO DE QUESTÕES (ATUALIZADO COM CAMPO PESQUISÁVEL) -->
                <div class="accordion-item" id="accBancoQuestoes">
                    <div class="accordion-header" id="btnToggleBanco" title="Clique para expandir/recolher">
                        <div class="acc-title-group">
                            <span class="acc-icon">📚</span>
                            <span class="acc-title">Banco de Questões (SAEB)</span>
                        </div>
                        <button class="btn-acc-toggle" id="btnAccIconBanco">▼</button>
                    </div>

                    <div class="accordion-body collapsed" id="bodyBanco">
                        <div class="form-group">
                            <label for="selectDescritorBanco">Digite ou Selecione o Descritor:</label>
                            <input 
                                type="text" 
                                id="selectDescritorBanco" 
                                list="listaDescritores" 
                                class="form-input" 
                                placeholder="Ex.: D1, D12 ou digite palavra-chave..." 
                                autocomplete="off"
                            >
                            <datalist id="listaDescritores">
                             <!-- As opções são geradas dinamicamente via JS (popularDatalistDescritores) -->
                            </datalist>
                        </div>

                        <!-- LISTA ONDE AS QUESTÕES DO BANCO SERÃO EXIBIDAS -->
                        <div id="containerBancoQuestoes" class="banco-lista">
                            <p class="msg-orientacao">Digite ou escolha um descritor acima para carregar as questões.</p>
                        </div>
                    </div>
                </div>

            </div>
            
        </aside>

        <!-- COLUNA DIREITA (EDITOR / LEITOR DE PÁGINAS) -->
        <section class="editor-panel">
            
            <div class="editor-toolbar">
                <div class="toolbar-left">
                    <button class="btn-expand-sidebar hidden" id="btnExpandSidebar" title="Expandir Menu">
                        ▶ Menu
                    </button>
                    <div class="layout-control">
                        <label for="selectColunas">Colunas:</label>
                        <select id="selectColunas" class="btn-select">
                            <option value="1">1 Coluna</option>
                            <option value="2" selected>2 Colunas</option>
                        </select>
                    </div>
                </div>

                <div class="toolbar-center">
                    <div class="page-counter">
                        <span class="page-box" id="paginaAtual">1</span>
                        <span class="page-slash">/</span>
                        <span id="totalPaginas">1</span>
                    </div>

                    <div class="toolbar-divider"></div>

                    <div class="zoom-controls">
                        <button class="btn-zoom-icon" id="btnZoomOut" title="Diminuir Zoom">−</button>
                        <button class="btn-zoom-value" id="btnZoomReset" title="Resetar para 100%">
                            <span id="zoomVal">100%</span>
                        </button>
                        <button class="btn-zoom-icon" id="btnZoomIn" title="Aumentar Zoom">+</button>
                    </div>
                </div>

<div class="toolbar-right">
    <div class="layout-control">
        <label for="selectModoGabarito">Cartão de Respostas:</label>
        <select id="selectModoGabarito" class="btn-select">
            <option value="nenhum">Sem Cartão</option>
            <option value="final_prova" selected>Ao Final da Prova</option>
            <option value="folha_separada">Em Folha Separada</option>
        </select>
    </div>
</div>

            </div>

            <!-- ÁREA DAS FOLHAS A4 -->
            <div class="workspace">
                <div id="container-folhas"></div>
            </div>

        </section>

    </main>

    <!-- MODAL DE PRÉ-VISUALIZAÇÃO DA QUESTÃO -->
    <div class="modal-overlay hidden" id="modalPreview">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Pré-visualização da Questão</h3>
                <button class="modal-close" id="btnFecharModal">&times;</button>
            </div>
            <div class="modal-body" id="modalBodyContent">
                <!-- Conteúdo renderizado via JS -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnModalFechar" type="button" onclick="modalPreview.classList.add('hidden')">Fechar</button>
                <button class="btn btn-primary" id="btnModalAdicionar" type="button" onclick="adicionarQuestaoDoModal()">➕ Adicionar</button>
            </div>
        </div>
    </div>

    <!-- BARRA INFERIOR (FOOTER) -->
    <footer class="app-footer">
        <span>Sistema de Avaliação SAEB - Modo de Edição</span>
        <span id="footerStatus">Pronto</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
